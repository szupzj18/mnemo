name: Release

# When a version bump lands on main (normally by merging a "Release x.y.z" PR),
# tag it, publish the GitHub Release from its CHANGELOG section, and upload the
# package to PyPI as mnemo-search. Re-running is safe: existing tags, releases
# and PyPI files are left alone.

on:
  push:
    branches: [main]
    paths: ["mnemo/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: v
        run: echo "version=$(python scripts/release.py current)" >> "$GITHUB_OUTPUT"
      - name: Tag and GitHub Release
        run: |
          v="${{ steps.v.outputs.version }}"
          python scripts/release.py notes "$v" > notes.md
          if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$v" -m "mnemo $v" "$GITHUB_SHA"
            git push origin "v$v"
          fi
          if ! gh release view "v$v" >/dev/null 2>&1; then
            gh release create "v$v" --title "mnemo $v" --notes-file notes.md --verify-tag --latest
          fi

  pypi:
    needs: github
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow + environment, no stored password.
    environment:
      name: pypi
      url: https://pypi.org/project/mnemo-search/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.github.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build
          python -m venv /tmp/check && /tmp/check/bin/pip install --quiet dist/*.whl
          test "$(/tmp/check/bin/mnemo --version)" = "mnemo ${{ needs.github.outputs.version }}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
